spring.application.name=servicio-cuentas
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:mysql://localhost:3306/banco_xyz?createDatabaseIfNotExists=true
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

batch.intereses.hilos=5
batch.intereses.chunk=10

batch.transacciones.skip-limite=20
batch.transacciones.retry-limite=3
batch.intereses.skip-limite=20
batch.intereses.retry-limite=3
batch.cuentas-anuales.skip-limite=20
batch.cuentas-anuales.retry-limite=3

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
