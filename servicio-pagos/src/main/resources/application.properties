spring.application.name=servicio-pagos
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/banco_pagos?createDatabaseIfNotExists=true
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Nombre logico en Eureka; lo resuelve Spring Cloud LoadBalancer.
cuentas.api.base-url=http://servicio-cuentas
cuentas.api.connect-timeout=2s
cuentas.api.read-timeout=3s

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

# Un pago COMPLETADO con monto mayor o igual a este valor publica ademas una alerta MONTO_ELEVADO.
alertas.monto-elevado=10000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
